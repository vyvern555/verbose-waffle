name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - name: Unzip
        run: unzip -oq AIPhotoEnhancer_step6.zip
      - name: Apply updates
        run: |
          for z in AIPhotoEnhancer_update1.zip AIPhotoEnhancer_update2.zip; do
            if [ -f "$z" ]; then unzip -oq "$z"; fi
          done
      - name: Download quality model
        run: |
          F=AIPhotoEnhancer_fixsrc/app/src/main/assets/models/realesrgan-x4plus.onnx
          URL=https://huggingface.co/jonathanst29/tinier-upscale-models/resolve/main/realesrgan-x4plus.onnx
          curl -L --fail --retry 3 -o "$F" "$URL" || rm -f "$F"
          if [ -f "$F" ] && [ "$(stat -c %s "$F")" -lt 50000000 ]; then rm -f "$F"; fi
          if [ -f "$F" ]; then echo "Модель скачана: $(stat -c %s "$F") байт"; else echo "::warning::Качественная модель не скачалась, в приложении будет только быстрая"; fi
      - name: Build
        working-directory: AIPhotoEnhancer_fixsrc
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        working-directory: AIPhotoEnhancer_fixsrc
        run: |
          grep '^e: ' build.log | head -15 | while IFS= read -r line; do echo "::error::${line}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: AIPhotoEnhancer_fixsrc/app/build/outputs/apk/debug/app-debug.apk
